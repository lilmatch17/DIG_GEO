# ============================================================
#  L7VP 后端 生产配置
#  本文件挂载到容器 /opt/l7vp/config/application.properties，
#  Spring Boot 会用「外部 config/ 下的 application.properties」覆盖
#  jar 内自带的配置（按 key 合并，缺省 key 回落到 jar 内部值），
#  因此改本文件即可生效，无需重新打 jar。
#
#  ★ 部署时必改：达梦数据库连接（下方 spring.datasource.*）
#  ★ 推荐用 docker-compose.yml 的 environment 控制中台地址（见文末）
# ============================================================

server.port=3001

# ---------- 前端静态资源（单 jar：dist 内嵌于 classpath:/static/）----------
# file:/opt/l7vp/config/ 优先：部署时把 config.js 放到 ./config/config.js 即可覆盖 jar 内配置，无需重新打 jar
spring.web.resources.static-locations=file:/opt/l7vp/config/,classpath:/META-INF/resources/,classpath:/static/

# ---------- 达梦数据库（★ 改为实际环境值）----------
spring.datasource.driver-class-name=dm.jdbc.driver.DmDriver
spring.datasource.url=jdbc:dm://192.168.1.100:5236/DIG_GEO
spring.datasource.username=DIG_GEO
spring.datasource.password=ChangeMe
# 连接建立后切到 DIG_GEO schema（9 张业务表都建在该 schema 下）
spring.datasource.hikari.connection-init-sql=SET SCHEMA DIG_GEO

# ---------- SQL 初始化 ----------
# 后端不会自动建表：需先在达梦中手动执行 schema.sql（从 jar 提取，见 README），这里保持 never
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql

# ---------- 日志（生产建议 INFO；排查问题改 DEBUG）----------
logging.level.com.antv.l7vp=INFO

# ---------- JSON / 时区 ----------
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# ---------- 文件上传 ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ---------- 缩略图 / 图标存储路径（容器内路径，与 docker-compose 挂载保持一致，勿改）----------
l7vp.thumbnails.path=/opt/l7vp/thumbnails
l7vp.thumbnails.url-prefix=/thumbnails
l7vp.icons.path=/opt/l7vp/icons
l7vp.icons.url-prefix=/icons

# ---------- 数据中台 SSO OAuth2 认证 ----------
# 优先用 docker-compose 的 environment 覆盖（ZHONGTAI_BASE_URL / APP_FRONTEND_URL / ZHONGTAI_CLIENT_ID / ZHONGTAI_CLIENT_SECRET / ZHONGTAI_SPACE_ID），
# 不传时回落到这里的默认值。
zhongtai.sso.authorize-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/sso/oauth/2/authorize
zhongtai.sso.token-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/sso/oauth/2/token
zhongtai.sso.userinfo-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/sso/oauth2/userinfo
zhongtai.sso.logout-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/sso/oauth2/logout
zhongtai.sso.redirect-uri=${APP_FRONTEND_URL:http://localhost:3001}/api/auth/callback
zhongtai.sso.frontend-url=${APP_FRONTEND_URL:http://localhost:3001}
zhongtai.sso.client-id=${ZHONGTAI_CLIENT_ID:clientId}
zhongtai.sso.client-secret=${ZHONGTAI_CLIENT_SECRET:clientSecret}

# 中台 API 地址（基地址统一由 ZHONGTAI_BASE_URL 控制）
zhongtai.api.resource-list-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/daasMeta/dataResource/list
zhongtai.api.api-resource-list-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/daasMeta/apiResource/list
zhongtai.api.unit-instance-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/daasECS/unit/instance/list
zhongtai.api.connect-info-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/daasECS/plugin/connect/info

# 中台 API 默认 Header 参数
# 空间 ID：中台编配嵌入时 URL 带 space_id，前端动态读取传给后端（优先于本兜底值）
zhongtai.api.space-id=${ZHONGTAI_SPACE_ID:79503c5c0eca4d159d051fc51a86cbed}
zhongtai.api.scope-type=Space
# zhongtai.api.tenant-id=

# ---------- HTTP Session（默认 8 小时）----------
zhongtai.session.max-inactive-interval=28800
server.servlet.session.timeout=28800
