server.port=3001

# 文件上传大小限制
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# 达梦数据库配置 (DIG_GEO schema)
spring.datasource.driver-class-name=dm.jdbc.driver.DmDriver
spring.datasource.url=jdbc:dm://localhost:5236/DIG_GEO
spring.datasource.username=SYSDBA
spring.datasource.password=SYSDBA

# SQL 初始化
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql

# 调试日志
logging.level.com.antv.l7vp=DEBUG

# JSON配置
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# 缩略图配置
l7vp.thumbnails.path=./thumbnails
l7vp.thumbnails.url-prefix=/thumbnails

# ========================================
# 数据中台 SSO 认证配置
# ========================================
zhongtai.sso.url=http://10.16.1.6:8081/sso/oauth2/token
zhongtai.sso.username=sjzt_admin
zhongtai.sso.password=sjzt_admin@4321
zhongtai.sso.grant-type=password
zhongtai.sso.client-id=clientId
zhongtai.sso.client-secret=clientSecret

# 中台 API 默认 Header 参数
zhongtai.api.space-id=default
zhongtai.api.scope-type=Space
# zhongtai.api.tenant-id=

# Token 缓存时间（分钟）
zhongtai.token.cache-minutes=30

# 图标配置
# 开发环境路径（相对于java-server目录）
# 内网部署环境路径通过启动参数覆盖：--l7vp.icons.path=/opt/L7VP/frontend/icons
l7vp.icons.path=../website/public/icons
l7vp.icons.url-prefix=/icons
