server.port=3001

# 文件上传大小限制
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# 达梦数据库配置 (DIG_GEO schema)
spring.datasource.driver-class-name=dm.jdbc.driver.DmDriver
spring.datasource.url=jdbc:dm://localhost:5236
spring.datasource.username=DIG_GEO
spring.datasource.password=Kylin_123
# 达梦默认「当前 schema」= 登录用户名。若登录用户不是 DIG_GEO（如本机开发只有 SYSDBA 用户），
# 当前 schema 会是 SYSDBA，未加前缀的表名(如 FROM PROJECTS)会报「无效的表或视图名」；
# 连接建立后强制切到 DIG_GEO，保证无论用哪个账号登录都能正确读到 DIG_GEO 下的表
spring.datasource.hikari.connection-init-sql=SET SCHEMA DIG_GEO

# SQL 初始化
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql

# 调试日志
logging.level.com.antv.l7vp=DEBUG

# JSON配置
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# 缩略图配置
l7vp.thumbnails.path=./thumbnails
l7vp.thumbnails.url-prefix=/thumbnails

# ========================================
# 数据中台 SSO OAuth2 认证配置（Authorization Code 流程）
# 部署时用环境变量覆盖（改环境变量即可，不用改代码）：
#   ZHONGTAI_BASE_URL         中台服务基地址（含端口），默认 http://10.16.1.6:8081
#   APP_FRONTEND_URL          地图软件自身前端地址（SSO 回调），默认 http://localhost:8000
#   ZHONGTAI_CLIENT_ID        中台 OAuth 客户端 ID（默认占位值 clientId）
#   ZHONGTAI_CLIENT_SECRET    中台 OAuth 客户端密钥（默认占位值 clientSecret）
# ========================================
zhongtai.sso.authorize-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/sso/oauth/2/authorize
zhongtai.sso.token-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/sso/oauth/2/token
zhongtai.sso.userinfo-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/sso/oauth2/userinfo
zhongtai.sso.logout-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/sso/oauth2/logout
zhongtai.sso.redirect-uri=${APP_FRONTEND_URL:http://localhost:8000}/api/auth/callback
zhongtai.sso.frontend-url=${APP_FRONTEND_URL:http://localhost:8000}
zhongtai.sso.client-id=${ZHONGTAI_CLIENT_ID:clientId}
zhongtai.sso.client-secret=${ZHONGTAI_CLIENT_SECRET:clientSecret}

# 中台 API 地址（基地址统一由 ZHONGTAI_BASE_URL 控制）
zhongtai.api.resource-list-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/daasMeta/dataResource/list
zhongtai.api.api-resource-list-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/daasMeta/apiResource/list
zhongtai.api.unit-instance-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/daasECS/unit/instance/list
zhongtai.api.connect-info-url=${ZHONGTAI_BASE_URL:http://10.16.1.6:8081}/daasECS/plugin/connect/info

# 应用库 appId（用于调用 unit/instance/list 拉取「库列表」）。中台应用库默认接 Doris，也可接 MySQL/达梦
zhongtai.api.app-id=${ZHONGTAI_APP_ID:872138c1-cd41-4695-aa03-e9f1d4aefc28}

# 中台 API 默认 Header 参数
# 空间 ID 现在作为兜底默认值：中台编配嵌入时会在 URL 带 space_id，前端动态读取后传给后端（优先于本默认值）
zhongtai.api.space-id=${ZHONGTAI_SPACE_ID:79503c5c0eca4d159d051fc51a86cbed}
zhongtai.api.scope-type=Space
# zhongtai.api.tenant-id=

# Token 缓存时间（分钟，已废弃 — 现在使用用户 Session）
# zhongtai.token.cache-minutes=30

# HTTP Session 最大空闲时间（秒），默认 8 小时
zhongtai.session.max-inactive-interval=28800
server.servlet.session.timeout=28800

# 图标配置
# 开发环境路径（相对于java-server目录）
# 内网部署环境路径通过启动参数覆盖：--l7vp.icons.path=/opt/L7VP/frontend/icons
l7vp.icons.path=../website/public/icons
l7vp.icons.url-prefix=/icons
