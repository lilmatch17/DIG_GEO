server.port=3001

# 文件上传大小限制
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# 达梦数据库配置 (DIG_GEO schema)
spring.datasource.driver-class-name=dm.jdbc.driver.DmDriver
spring.datasource.url=jdbc:dm://localhost:5236
spring.datasource.username=DIG_GEO
spring.datasource.password=Kylin_123

# SQL 初始化
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql

# 调试日志
logging.level.com.antv.l7vp=DEBUG

# JSON配置
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# 缩略图配置
l7vp.thumbnails.path=./thumbnails
l7vp.thumbnails.url-prefix=/thumbnails

# ========================================
# 数据中台 SSO OAuth2 认证配置（Authorization Code 流程）
# SSO 服务器（与中台同服）: 10.16.1.6:8081/sso
# ========================================
zhongtai.sso.authorize-url=http://10.16.1.6:8081/sso/oauth/2/authorize
zhongtai.sso.token-url=http://10.16.1.6:8081/sso/oauth/2/token
zhongtai.sso.userinfo-url=http://10.16.1.6:8081/sso/oauth2/userinfo
zhongtai.sso.logout-url=http://10.16.1.6:8081/sso/oauth2/logout
zhongtai.sso.redirect-uri=http://localhost:8000/api/auth/callback
zhongtai.sso.frontend-url=http://localhost:8000
zhongtai.sso.client-id=clientId
zhongtai.sso.client-secret=clientSecret

# 中台 API 地址
zhongtai.api.resource-list-url=http://10.16.1.6:8081/daasMeta/dataResource/list
zhongtai.api.api-resource-list-url=http://10.16.1.6:8081/daasMeta/apiResource/list
zhongtai.api.unit-instance-url=http://10.16.1.6:8081/daasECS/unit/instance/list
zhongtai.api.connect-info-url=http://10.16.1.6:8081/daasECS/plugin/connect/info

# 应用库 appId（用于调用 unit/instance/list 拉取「库列表」）。中台应用库默认接 Doris，也可接 MySQL/达梦
zhongtai.api.app-id=872138c1-cd41-4695-aa03-e9f1d4aefc28

# 中台 API 默认 Header 参数
# 空间ID = 中台「默认业务空间」（从抓包确认）。若测试用户归属其它空间，需改成对应空间ID，或改为调用中台「空间列表」接口动态获取
zhongtai.api.space-id=79503c5c0eca4d159d051fc51a86cbed
zhongtai.api.scope-type=Space
# zhongtai.api.tenant-id=

# Token 缓存时间（分钟，已废弃 — 现在使用用户 Session）
# zhongtai.token.cache-minutes=30

# HTTP Session 最大空闲时间（秒），默认 8 小时
zhongtai.session.max-inactive-interval=28800
server.servlet.session.timeout=28800

# 图标配置
# 开发环境路径（相对于java-server目录）
# 内网部署环境路径通过启动参数覆盖：--l7vp.icons.path=/opt/L7VP/frontend/icons
l7vp.icons.path=../website/public/icons
l7vp.icons.url-prefix=/icons
